name: exp caller

# THROWAWAY — pst epic #104 phase-0 experiment; PR never merges.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  guards:
    uses: carpet-stain/project-starter-template/.github/workflows/exp-guard.yml@experiment-workflow-call
    secrets: inherit

  local-probe:
    runs-on: ubuntu-latest
    env:
      K: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - run: 'if [ -n "$K" ]; then echo "local secret present (len ${#K})"; else echo "local secret ABSENT"; fi'
